description:
  en: Edge-style nested session groups for the DSH sidebar on DSH Web and Desktop, with workspace tree, single-list view, recursive sorting, RGB colors, collapsed status summaries, subagent browsing, and an approval-gated agent tool for organizing groups.
  zh: DSH 侧栏会话分组插件，支持 DSH Web / Desktop；最多三层的组内分组、工作区树、单列表、递归排序、RGB 自定义颜色、折叠状态汇总、子代理展开与状态联动，以及需要用户审核的 AI 会话整理工具。
